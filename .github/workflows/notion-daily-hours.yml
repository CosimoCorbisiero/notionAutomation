name: Sync Notion daily hours

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm --prefix notionAutomation test

      - name: Sync today's Notion entries
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TIME_ZONE: Europe/Rome
        run: node notionAutomation/src/sync.js
